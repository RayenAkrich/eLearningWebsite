<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier mon compte</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-page">
    <header class="navbar">
        <div class="logo">
            <h1>eLearning</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="{{ url_for(role + '_dashboard') }}" class="btn btn-secondary"><i class="fas fa-home"></i>Dashboard</a></li>
                <li><a href="{{ url_for('logout') }}" class="btn btn-primary"><i class="fas fa-sign-out-alt"></i>Déconnexion</a></li>
            </ul>
        </nav>
    </header>
    <section class="login-section">
        <div class="login-background">
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
                <div class="shape shape-5"></div>
            </div>
        </div>
        <div class="login-container">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-user-circle"></i>
                </div>
                <h2>Modifier mon compte</h2>
                <p>Veuillez mettre à jour vos informations personnelles et votre mot de passe si nécessaire.</p>
            </div>
            <form id="editAccountForm" class="form" method="post" autocomplete="off">
                <div class="form-group">
                    <div class="input-container">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="nom" name="nom" required placeholder=" " value="{{ user.nom }}">
                        <label for="nom">Nom</label>
                        <div class="input-border"></div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-container">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" required placeholder=" " value="{{ user.email }}">
                        <label for="email">Email</label>
                        <div class="input-border"></div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-container">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="text" id="phone" name="phone" required maxlength="8" pattern="\d{8}" placeholder=" " value="{{ user.phone }}">
                        <label for="phone">Téléphone</label>
                        <div class="input-border"></div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-container">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="old_mdp" name="old_mdp" required placeholder=" ">
                        <label for="old_mdp">Ancien mot de passe</label>
                        <button type="button" class="password-toggle" id="password-toggle-old">
                            <i class="fas fa-eye"></i>
                        </button>
                        <div class="input-border"></div>
                    </div>
                </div>                
                <div class="form-group">
                    <div class="input-container">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="new_mdp" name="new_mdp" required placeholder=" ">
                        <label for="new_mdp">Nouveau mot de passe</label>
                        <button type="button" class="password-toggle" id="password-toggle-new">
                            <i class="fas fa-eye"></i>
                        </button>
                        <div class="input-border"></div>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
                    <button type="reset" class="btn btn-secondary">Réinitialiser</button>
                </div>
                <p id="editAccountMessage" class="error-message"></p>
            </form>
        </div>
    </section>    
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 by Rayen Akriche. Tous droits réservés.</p>
            <div class="footer-social">
                <a href="https://www.facebook.com/rayen.akrich.0/" class="social-link"><i class="fab fa-facebook"></i></a>
                <a href="https://github.com/RayenAkrich" class="social-link"><i class="fab fa-github"></i></a>
                <a href="https://www.linkedin.com/in/akricherayen/" class="social-link"><i class="fab fa-linkedin"></i></a>
                <a href="https://www.instagram.com/rayen._.akrich/" class="social-link"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='editAccount.js') }}"></script>
</body>
</html>
