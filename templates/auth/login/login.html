<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Plateforme d'Apprentissage en Ligne</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-page">
    <!-- Barre de navigation -->
    <header class="navbar">
        <div class="logo">
            <h1>eLearning</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}" class="btn btn-secondary"><i class="fas fa-home"></i>Accueil</a></li>
                <li><a href="{{ url_for('signup') }}" class="btn btn-primary"><i class="fas fa-user-plus"></i>Inscription</a></li>
            </ul>
        </nav>
    </header>

    <section class="login-section">
        <div class="login-background">
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
                <div class="shape shape-5"></div>
            </div>
        </div>
        
        <div class="login-container">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-user-circle"></i>
                </div>
                <h2>Connexion</h2>
                <p>Accédez à votre espace d'apprentissage</p>
            </div>
            
            <form id="login-form" autocomplete="off" method="post" action="javascript:void(0);">
                <div class="form-group">
                    <div class="input-container">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" required placeholder=" ">
                        <label for="email">Email</label>
                        <div class="input-border"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="input-container">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" required placeholder=" ">
                        <label for="password">Mot de passe</label>
                        <button type="button" class="password-toggle" id="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                        <div class="input-border"></div>
                    </div>
                </div>
                
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary btn-login">
                        <span class="btn-text">Se connecter</span>
                        <div class="btn-loader">
                            <div class="spinner"></div>
                        </div>
                    </button>
                    <button type="reset" class="btn btn-secondary">
                        <i class="fas fa-redo"></i>
                        Réinitialiser
                    </button>
                </div>
            </form>
            
            <div class="login-footer">
                <p>Pas encore de compte ? <a href="{{ url_for('signup') }}" class="signup-link">Créer un compte</a></p>
            </div>
            
            <p id="error-message" class="error-message"></p>
        </div>
    </section>

    <!-- Pied de page -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 by Rayen Akriche. Tous droits réservés.</p>
            <div class="footer-social">
                <a href="https://www.facebook.com/rayen.akrich.0/" class="social-link"><i class="fab fa-facebook"></i></a>
                <a href="https://github.com/RayenAkrich" class="social-link"><i class="fab fa-github"></i></a>
                <a href="https://www.linkedin.com/in/akricherayen/" class="social-link"><i class="fab fa-linkedin"></i></a>
                <a href="https://www.instagram.com/rayen._.akrich/" class="social-link"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='login.js') }}"></script>

</body>
</html>
