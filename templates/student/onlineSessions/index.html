<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes séances en ligne</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><h1>eLearning</h1></div>
        <nav>
            <ul class="nav-links">
                <li><a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary"><i class="fas fa-home"></i>Dashboard</a></li>
                <li><a href="{{ url_for('disconnect') }}" class="btn btn-secondary"><i class="fas fa-sign-out-alt"></i>Déconnexion</a></li>
            </ul>
        </nav>
    </header>
    <main class="form-main">
        <div class="table-container">
            <h2>Mes séances en ligne</h2>
            <div class="table-responsive">
                <table id="sessionsTable">
                    <thead>
                        <tr>
                            <th>Matière</th>
                            <th>Date et heure</th>
                            <th>Description</th>
                            <th>Lien</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for session in sessions %}
                        <tr>
                            <td>{{ session['speciality'] }}</td>
                            <td>{{ session['timedate'] }}</td>
                            <td>{{ session['descrp'] }}</td>
                            <td>{% if session['link'] %}<a href="{{ session['link'] }}" target="_blank">Ouvrir</a>{% endif %}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
