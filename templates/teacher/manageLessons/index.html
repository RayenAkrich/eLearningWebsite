<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des cours</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="logo"><h1>eLearning</h1></div>
        <nav>
            <ul class="nav-links">
                <li><a href="{{ url_for('teacher_dashboard') }}" class="btn btn-secondary">Dashboard</a></li>
                <li><a href="{{ url_for('logout') }}" class="btn btn-secondary">Déconnexion</a></li>
            </ul>
        </nav>
    </header>
    <main class="form-main">
        <div class="table-container">
            <h2>Mes cours</h2>
            <button class="btn btn-primary" onclick="showAddLessonForm()" style="margin-bottom:1rem;">Ajouter un cours</button>
            <div class="table-responsive">
                <table id="lessonsTable">
                    <thead>
                        <tr>
                            {% for col, title in columns %}
                            <th onclick="sortTable('lessonsTable', {{ loop.index0 }})">{{ title }}</th>
                            {% endfor %}
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for lesson in lessons %}
                        <tr>
                            {% for col, title in columns %}
                            <td>{{ lesson[col] }}</td>
                            {% endfor %}
                            <td class="action-btns">
                                <button class="btn btn-secondary" onclick="deleteLesson({{ lesson['idCourse'] }})">Supprimer</button>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        <div id="addLessonModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close" onclick="closeAddLessonForm()">&times;</span>
                <h3>Ajouter un cours</h3>
                <form id="addLessonForm" autocomplete="off">
                    <div class="form-group">
                        <label for="title">Titre *</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="descrp">Description</label>
                        <input type="text" id="descrp" name="descrp">
                    </div>
                    <div class="form-group">
                        <label for="class">Classe *</label>
                        <input type="text" id="class" name="class" required>
                    </div>
                    <div class="form-group">
                        <label for="file_path">Fichier (lien ou chemin) *</label>
                        <input type="text" id="file_path" name="file_path" required>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary">Ajouter</button>
                        <button type="button" class="btn btn-secondary" onclick="closeAddLessonForm()">Annuler</button>
                    </div>
                </form>
            </div>
        </div>
        <div id="addLessonPopup" class="popup-message" style="display:none;"></div>
        <p id="manageLessonsMessage" class="error-message"></p>
    </main>
    <script src="{{ url_for('static', filename='manageLessons.js') }}"></script>
</body>
</html>
