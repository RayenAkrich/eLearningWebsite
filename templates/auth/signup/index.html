<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Plateforme d'Apprentissage en Ligne</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-page">
    <header class="navbar">
        <div class="logo">
            <h1>eLearning</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}" class="btn btn-secondary"><i class="fas fa-home"></i>Accueil</a></li>
                <li><a href="{{ url_for('login') }}" class="btn btn-primary"><i class="fas fa-user-circle"></i>Connexion</a></li>
            </ul>
        </nav>
    </header>
    <section class="login-section">
        <div class="login-background">
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
                <div class="shape shape-5"></div>
            </div>
        </div>
        
        <div class="login-container">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2>Inscription</h2>
                <p>Rejoignez notre communauté d'apprentissage</p>
            </div>
            
            <form id="signup-form" autocomplete="off" method="post" action="javascript:void(0);">
                <div class="form-row">
                    <div class="form-group">
                        <div class="input-container">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="nom" name="nom" required placeholder=" ">
                            <label for="nom">Nom</label>
                            <div class="input-border"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="input-container">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" required placeholder=" ">
                            <label for="email">Email</label>
                            <div class="input-border"></div>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <div class="input-container">
                            <i class="fas fa-phone input-icon"></i>
                            <input type="text" id="phone" name="phone" required maxlength="8" pattern="\d{8}" placeholder=" ">
                            <label for="phone">Téléphone</label>
                            <div class="input-border"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="input-container">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="mdp" name="mdp" required placeholder=" ">
                            <label for="mdp">Mot de passe</label>
                            <button type="button" class="password-toggle" id="password-toggle">
                                <i class="fas fa-eye"></i>
                            </button>
                            <div class="input-border"></div>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="select-container">
                        <i class="fas fa-user-tag input-icon"></i>
                        <select id="roles" name="roles" required>
                            <option value="" disabled selected>Choisir un rôle</option>
                            <option value="student">Étudiant</option>
                            <option value="teacher">Enseignant</option>
                        </select>
                        <div class="select-arrow">
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="input-border"></div>
                    </div>
                </div>
                
                <div class="form-group" id="class-group">
                    <div class="select-container">
                        <i class="fas fa-graduation-cap input-icon"></i>
                        <select id="class" name="class">
                            <option value="" disabled selected>Choisir une classe</option>
                            <option value="1er Année">1er Année</option>
                            <option value="2eme Science">2eme Science</option>
                            <option value="2eme Informatique">2eme Informatique</option>
                            <option value="3eme Science">3eme Science</option>
                            <option value="3eme Technique">3eme Technique</option>
                            <option value="3eme Mathématiques">3eme Mathématiques</option>
                            <option value="3eme Informatique">3eme Informatique</option>
                            <option value="Bac Math">Bac Math</option>
                            <option value="Bac science">Bac science</option>
                            <option value="Bac Info">Bac Info</option>
                            <option value="Bac Technique">Bac Technique</option>
                        </select>
                        <div class="select-arrow">
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="input-border"></div>
                    </div>
                </div>
                
                <div class="form-group" id="speciality-group">
                    <div class="select-container">
                        <i class="fas fa-book input-icon"></i>
                        <select id="speciality" name="speciality">
                            <option value="" disabled selected>Choisir une spécialité</option>
                            <option value="Mathématique">Mathématique</option>
                            <option value="Physique">Physique</option>
                            <option value="Francais">Francais</option>
                            <option value="Arabe">Arabe</option>
                            <option value="Anglais">Anglais</option>
                            <option value="SVT">SVT</option>
                            <option value="Philosophie">Philosophie</option>
                            <option value="Informatique">Informatique</option>
                            <option value="Technique">Technique</option>
                        </select>
                        <div class="select-arrow">
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="input-border"></div>
                    </div>
                </div>
                
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary btn-signup">
                        <span class="btn-text">S'inscrire</span>
                        <div class="btn-loader">
                            <div class="spinner"></div>
                        </div>
                    </button>
                    <button type="reset" class="btn btn-secondary">
                        <i class="fas fa-redo"></i>
                        Réinitialiser
                    </button>
                </div>
            </form>
            
            <div class="signup-footer">
                <p>Vous avez déjà un compte ? <a href="{{ url_for('login') }}" class="login-link">Se connecter</a></p>
            </div>
            <p id="error-message" class="error-message"></p>
        </div>
    </section>

        <!-- Pied de page -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 by Rayen Akriche. Tous droits réservés.</p>
            <div class="footer-social">
                <a href="https://www.facebook.com/rayen.akrich.0/" class="social-link"><i class="fab fa-facebook"></i></a>
                <a href="https://github.com/RayenAkrich" class="social-link"><i class="fab fa-github"></i></a>
                <a href="https://www.linkedin.com/in/akricherayen/" class="social-link"><i class="fab fa-linkedin"></i></a>
                <a href="https://www.instagram.com/rayen._.akrich/" class="social-link"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='signup.js') }}"></script>
</body>
</html>
