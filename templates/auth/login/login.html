<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Plateforme d'Apprentissage en Ligne</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <!-- Barre de navigation -->
    <header class="navbar">
        <div class="logo">
            <h1>eLearning</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}" class="btn btn-secondary">Accueil</a></li>
                <li><a href="{{ url_for('signup') }}" class="btn btn-primary">Inscription</a></li>
            </ul>
        </nav>
    </header>

    <!-- Section principale : Formulaire de connexion -->
    <section class="login-section">
        <div class="login-container">
            <h2>Connexion</h2>
            <form id="login-form" autocomplete="off" method="post" action="javascript:void(0);">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group checkbox">
                    <input type="checkbox" id="show-password">
                    <label for="show-password">Afficher le mot de passe</label>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">Soumettre</button>
                    <button type="reset" class="btn btn-secondary">Réinitialiser</button>
                </div>
            </form>
            <p id="error-message" class="error-message"></p>
        </div>
    </section>

    <!-- Pied de page -->
    <footer class="footer">
        <p>© 2025 by Rayen Akriche. Tous droits réservés.</p>
    </footer>

    <script src="{{ url_for('static', filename='login.js') }}"></script>

</body>
</html>
